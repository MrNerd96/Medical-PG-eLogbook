<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PG e-Logbook</title>
  <meta name="description" content="Offline e-logbook for medical postgraduate (MD/MS) students in India, following NMC PGMER-2023.">
  <meta name="theme-color" content="#0b6b5d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar no-print">
    <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
    <a href="#/dashboard" class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"> PG e-Logbook</a>
    <span class="tag">NMC PGMER-2023</span>
  </header>
  <div class="layout">
    <nav id="nav" class="sidebar no-print" aria-label="Sections"></nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="modal" class="modal no-print" hidden role="dialog" aria-modal="true">
    <div class="modal-body"></div>
  </div>
  <div id="toast" class="toast no-print" role="status" aria-live="polite"></div>
  <noscript>This app needs JavaScript enabled.</noscript>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
